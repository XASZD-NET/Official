<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เปิดลิงก์และรหัสผ่าน</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1115;
      color: #f3f4f6;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .box {
      background: #111318;
      border: 1px solid #262b36;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .label {
      font-size: 0.78rem;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5e7eb;
      word-break: break-all;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-copy {
      background: #2563eb;
      color: #ffffff;
      flex-shrink: 0;
    }

    .btn-copy:hover {
      background: #1d4ed8;
    }

    .btn-open {
      width: 100%;
      background: #16a34a;
      color: #ffffff;
      padding: 12px;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .btn-open:hover {
      background: #15803d;
    }

    .status {
      margin-top: 12px;
      font-size: 0.84rem;
      min-height: 20px;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">เปิดลิงก์และรหัสผ่าน</h1>
    <p class="desc">คัดลอกรหัสผ่านด้านล่าง แล้วเปิดลิงก์เพื่อใช้งาน</p>

    <div class="box">
      <div class="label">รหัสผ่าน</div>
      <div class="value-row">
        <span id="passwordText" class="code-text">KILLCRITIC</span>
        <button id="copyBtn" type="button" class="btn btn-copy">คัดลอก</button>
      </div>
    </div>

    <div class="box">
      <div class="label">ลิงก์ปลายทาง</div>
      <div class="value-row">
        <span id="linkText" class="code-text">https://thinfi.com/0m9em</span>
      </div>
    </div>

    <a
      id="openLinkBtn"
      class="btn btn-open"
      href="https://thinfi.com/0m9em"
      target="_blank"
      rel="noopener noreferrer"
    >
      เปิดลิงก์ https://thinfi.com/0m9em
    </a>

    <div id="statusMsg" class="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const PASSWORD_VALUE = "KILLCRITIC";
    const TARGET_URL = "https://thinfi.com/0m9em";

    const copyBtn = document.getElementById("copyBtn");
    const statusMsg = document.getElementById("statusMsg");
    const openLinkBtn = document.getElementById("openLinkBtn");

    openLinkBtn.href = TARGET_URL;

    copyBtn.addEventListener("click", async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(PASSWORD_VALUE);
        } else {
          const tempInput = document.createElement("input");
          tempInput.value = PASSWORD_VALUE;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand("copy");
          document.body.removeChild(tempInput);
        }
        statusMsg.textContent = `คัดลอกรหัสผ่าน "${PASSWORD_VALUE}" แล้ว`;
      } catch (err) {
        statusMsg.textContent = `รหัสผ่านคือ: ${PASSWORD_VALUE}`;
      }
    });
  </script>
</body>
</html>
